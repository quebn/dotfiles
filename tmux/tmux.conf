# ============================================================
# tmux.conf
# Sections: prefix · general · keys · theme · plugins
# ============================================================


# ---------- Prefix -----------------------------------------------
unbind C-b
set -g prefix M-m
bind M-m send-prefix


# ---------- General ----------------------------------------------
set -g base-index 1         # windows are numbered from 1
setw -g pane-base-index 1   # panes are numbered from 1
set -g renumber-windows on  # keep window numbers consecutive on close
set -g mouse on
set -g default-terminal "screen-256color"

# custom tmux build: colour source + styling for the built-in tree mode
set -s theme terminal
set -g tree-mode-border-style "fg=themecyan"


# ---------- Keys --------------------------------------------------
# prefix + 2..5: jump to that window, creating it when it is missing
bind 2 if-shell "tmux select-window -t :2" '' "new-window -t :2"
bind 3 if-shell "tmux select-window -t :3" '' "new-window -t :3"
bind 4 if-shell "tmux select-window -t :4" '' "new-window -t :4"
bind 5 if-shell "tmux select-window -t :5" '' "new-window -t :5"

# prefix + ^ : last window
bind ^ last-window

# hjkl: move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ---------- Rosé Pine theme (main) --------------------------------
# Inlined from plugins/rosepine-tmux, so the plugin itself no longer runs.
# Palette: base    #191724   surface #1f1d2e   overlay #26233a
#          muted   #6e6a86   subtle  #908caa   text    #e0def4
#          love    #eb6f92   gold    #f6c177   rose    #ebbcba
#          pine    #31748f   foam    #9ccfd8   iris    #c4a7e7
#          hl-low  #21202e   hl-med  #403d52   hl-high #524f67

# --- status bar ---
set -g status on
set -g status-style 'fg=#31748f,bg=default'      # pine on transparent
set -g status-left-length 200
set -g status-right-length 200

# session name: rose normally, love while the prefix key is held
set -g status-left '#[fg=#{?client_prefix,#eb6f92,#ebbcba},bg=#1f1d2e]  #S #[fg=#{?client_prefix,#eb6f92,#ebbcba}, bg=default]▌ '

# current directory
set -g status-right '#[bg=default, fg=#9ccfd8]▐#[fg=#9ccfd8, bg=#1f1d2e] 󱉭 #{b:pane_current_path} '

# --- messages ---
set -g message-style 'fg=#f6c177,bg=default'          # gold
set -g message-command-style 'fg=#191724,bg=#f6c177'  # base on gold

# --- copy mode (text selection) ---
# green/black from the custom build palette (set -s theme terminal)
setw -g mode-style 'bg=themegreen,fg=#000000'

# --- panes ---
set -g pane-border-style 'fg=#524f67'             # hl-high
set -g pane-active-border-style 'fg=#f6c177'      # gold
set -g display-panes-colour '#f6c177'             # gold
set -g display-panes-active-colour '#e0def4'      # text

# --- window list ---
set -g window-status-style 'fg=#908caa,bg=default'           # subtle
set -g window-status-current-style 'fg=#31748f,bg=default'   # pine
set -g window-status-activity-style 'fg=#908caa,bg=default'  # subtle (idle look)

# idle:   "- 2: name"   current: "● 2: name"
set -g window-status-format '#[fg=#908caa,bg=default,bold]- #I#[fg=#908caa,bg=default]:#W'
set -g window-status-current-format '#[fg=#31748f,bg=default,bold]● #I#[fg=#31748f,bg=default]:#W'
